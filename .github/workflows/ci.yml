name: Smoke Test

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

env:
  LC_ALL: en_US.UTF-8

jobs:
  JDKxx_Matrix:
    strategy:
      fail-fast: false
      matrix:
        isMain:
          - ${{ contains(github.ref, 'trunk') }}
        java: [ 25 ]
        os: [ ubuntu-latest, windows-latest ]
    name: JDK${{ matrix.java }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
    - name: Build
      run: |
        mvn clean install failsafe:integration-test

    - name: Upload logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: JDK${{ matrix.java }}-${{ matrix.os }}-logs
        retention-days: 7
